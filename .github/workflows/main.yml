name: Test and publish bafser

on:
  pull_request:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["3.10", "3.11", "3.12", "3.13", "3.14"]' || '["3.10", "3.14"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and checkers
        run: python -m pip install . pyright ruff
      - name: Check source and behavior
        run: |
          python -m compileall -q src test
          python -m ruff check src test
          python -m unittest discover -s test -v
          pyright --project test/typing --pythonversion "${{ matrix.python-version }}"

  mysql:
    name: Real MySQL transactions and locks
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root
          MYSQL_DATABASE: bafser_test
          MYSQL_USER: bafser
          MYSQL_PASSWORD: bafser
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      BAFSER_TEST_MYSQL_URL: mysql+pymysql://bafser:bafser@127.0.0.1:3306/bafser_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install .
      - name: Require real database tests without skips
        run: python -m test.run_mysql_ci

  artifacts:
    name: Wheel and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install build
          python -m build
      - name: Check installed wheel away from the checkout
        run: |
          python -m venv "$RUNNER_TEMP/bafser-wheel"
          "$RUNNER_TEMP/bafser-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/bafser-wheel/bin/python" test/artifact_smoke.py
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          "$RUNNER_TEMP/bafser-wheel/bin/python" - <<'PY'
          import os
          from importlib.metadata import version

          tag_version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          package_version = version("bafser")

          if tag_version != package_version:
              raise SystemExit(
                  f"Version mismatch: tag={tag_version}, "
                  f"package={package_version}"
              )

          print(f"Version OK: {package_version}")
          PY
      - name: Rebuild and check the source distribution
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/bafser-rebuilt" dist/*.tar.gz
          python -m venv "$RUNNER_TEMP/bafser-sdist"
          "$RUNNER_TEMP/bafser-sdist/bin/python" -m pip install "$RUNNER_TEMP"/bafser-rebuilt/*.whl
          "$RUNNER_TEMP/bafser-sdist/bin/python" test/artifact_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [compatibility, mysql, artifacts]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/bafser
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
