[build-system]
requires = ["hatchling >= 1.26, < 2"]
build-backend = "hatchling.build"

[project]
name = "bafser"
version = "2.18.0"
authors = [{ name = "Mixel Te" }]
description = "Base for flask server"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
	"alembic >= 1.16.4, < 2",
	"cryptography >= 46.0.5, < 51",
	"concurrent-log-handler >= 0.9.28, < 1",
	"flask >= 3.1.1, < 4",
	"flask_jwt_extended >= 4.7.1, < 5",
	"PyJWT >= 2.0, < 3.0",
	"PyMySQL >= 1.1.1, < 2",
	"python-dotenv >= 1.0, < 2",
	"sqlalchemy >= 2.0.45, < 2.1",
	"sqlalchemy_serializer >= 1.6.2, < 2",
	"typing_extensions >= 4.13.2, < 5",
	"werkzeug >= 3.1.3, < 4",
]

[project.urls]
Homepage = "https://github.com/MixelTe/bafser"
Issues = "https://github.com/MixelTe/bafser/issues"

[project.scripts]
bafser = "bafser_cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/bafser", "src/bafser_cli"]

[tool.hatch.build.targets.sdist]
only-include = ["src/bafser", "src/bafser_cli"]
include = [
  "/LICENSE*",
  "/README.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 150

[tool.ruff.lint]
select = [
  "E4", "E7", "E9", "F", "E501",
  # Focused correctness checks, without a broad style/API migration.
  "B006", "B012", "B018", "B023", "B026", "B032", "B033",
  "PGH004", "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# The facade loads configuration before importing its consumers.
"src/bafser/__init__.py" = ["E402"]

[tool.pyright]
include = ["src"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
venv = ".venv"
typeCheckingMode = "strict"
